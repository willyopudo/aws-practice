# SonarCloud. SONAR_TOKEN comes from the environment (local) or a repo secret (CI).
sonar.host.url=https://sonarcloud.io
sonar.organization=arisappsorg
sonar.projectKey=arisappsorg_aws-practice
sonar.projectName=aws-practice

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,coverage/**,.agent/**,**/.terraform/**,demo-files/**,specs/**
sonar.test.inclusions=tests/**

# SonarCloud has no shell analyzer, so shell coverage is gated locally by `make coverage`.
# Sonar covers Terraform/IaC, secrets, GitHub Actions and Dockerfile rules.
sonar.coverage.exclusions=**/*.sh,**/*.bash
