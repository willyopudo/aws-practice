name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # empty on forks -> Sonar step skipped
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar needs history for new-code detection

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.x
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - name: Install shellcheck + bats
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Coverage (kcov in Docker, same as local)
        run: make coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: -Dsonar.qualitygate.wait=true
