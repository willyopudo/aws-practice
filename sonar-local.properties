# Local SonarQube Community run (scripts/sonar-local.sh). Mirrors sonar-project.properties
# minus the SonarCloud-only keys (host, organization, branch).
sonar.projectKey=aws-practice-local
sonar.projectName=aws-practice (local)

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,coverage/**,.agent/**,**/.terraform/**,demo-files/**,specs/**,.scannerwork/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=**/*.sh,**/*.bash
